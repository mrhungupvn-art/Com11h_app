plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Đọc thông tin keystore (file .jks/.keystore + mật khẩu) từ android/keystore.properties
// — file này KHÔNG commit lên git, mỗi máy build tự tạo riêng (xem HUONG_DAN_KY_APP.md).
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.com11h.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.com11h.app'
        minSdk 23
        targetSdk 36
        versionCode 11
        versionName '1.6.0'
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

kotlin {
    jvmToolchain(17)
}
